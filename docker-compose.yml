services:
  postgres:
    image: postgres:16-alpine
    container_name: collab_db
    environment:
      POSTGRES_DB: collab_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: collabpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: collab_keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: start-dev --import-realm
    volumes:
      - ./local-environment/keycloak:/opt/keycloak/data/import
    ports:
      - "8082:8080"

volumes:
  postgres_data:
