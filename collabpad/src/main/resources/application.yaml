server:
  port: 8081

spring:
  application:
    name: collabpad
    
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:5432/collab_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:collabpassword}
    driver-class-name: org.postgresql.Driver

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${CLERK_ISSUER_URI:http://${KEYCLOAK_HOST:localhost}:8082/realms/collabpad-realm}
    
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    
  flyway:
    enabled: false
