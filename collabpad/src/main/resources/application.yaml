spring:
  application:
    name: collabpad
    
  server:
    port: 8081

  datasource:
    url: jdbc:postgresql://localhost:5432/collab_db
    username: postgres
    password: collabpassword
    driver-class-name: org.postgresql.Driver

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8082/realms/collabpad-realm
    
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # Automatically create our tables from our Java Entities!
      ddl-auto: update
    show-sql: true
    
  # We will leave Flyway disabled for now so Hibernate handles the initial schema
  flyway:
    enabled: false
