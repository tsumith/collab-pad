spring:
  application:
    name: collabpad
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/collab_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:collabpassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
